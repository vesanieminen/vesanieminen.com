<!DOCTYPE html>
<html lang="en" data-locale="en" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Vesa Nieminen — professional software developer / game developer hobbyist fella in Turku, Finland. Maker of Liukuri.">
  <meta name="theme-color" content="#141311">
  <meta property="og:title" content="Vesa Nieminen">
  <meta property="og:description" content="Software developer and game hobbyist in Turku. Maker of Liukuri.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://vesanieminen.com">
  <link rel="icon" href="https://avatars.githubusercontent.com/u/108755?s=640&v=4">
  <title>Vesa Nieminen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@360;420;500;580;650&display=swap" rel="stylesheet">
  <script>
    (function () {
      var root = document.documentElement;
      var list = (navigator.languages && navigator.languages.length)
        ? navigator.languages
        : [navigator.language || "en"];
      var browserFi = false;
      for (var i = 0; i < list.length; i++) {
        if (String(list[i]).toLowerCase().split("-")[0] === "fi") {
          browserFi = true;
          break;
        }
      }
      var locale = null;
      var theme = null;
      try {
        locale = localStorage.getItem("locale");
        theme = localStorage.getItem("theme");
      } catch (e) {}
      if (locale !== "fi" && locale !== "en") locale = browserFi ? "fi" : "en";
      if (theme !== "light" && theme !== "dark" && theme !== "system") theme = "system";
      root.lang = locale;
      root.setAttribute("data-locale", locale);
      root.setAttribute("data-theme", theme);
      var descriptions = {
        en: "Vesa Nieminen — professional software developer / game developer hobbyist fella in Turku, Finland. Maker of Liukuri.",
        fi: "Vesa Nieminen — ohjelmistokehittäjä / pelikehittäjäharrastelija Turusta. Liukurin tekijä."
      };
      var meta = document.querySelector('meta[name="description"]');
      if (meta) meta.setAttribute("content", descriptions[locale]);
    })();
  </script>
</head>
</html>
